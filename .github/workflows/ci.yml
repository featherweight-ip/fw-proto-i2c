# featherweight-ip/fw-proto-i2c -- GitHub Actions.
#
# COPY THIS AS A PAIR. Its counterpart is .forgejo/workflows/ci.yml. If
# .forgejo/workflows/ is absent the Forgejo runner falls back to running THIS
# FILE. The two differ only where the forges do: the Forgejo side adds the
# internal-identifier check and uses forgejo/upload-artifact. This side also
# passes GITHUB_TOKEN to ci/run.sh (on Forgejo that token is not a GitHub one)
# and uses actions/cache v5 (the Forgejo mirror is tested on v4). If you are
# changing anything else, they are drifting.
#
# What runs is ci/run.sh -- the same script on both forges, and on a laptop.
# This file only sets up the cache, calls it, and keeps the logs.
#
# NOTHING HERE PUBLISHES. That is why there is no release-authority `gate` job
# (see dvkit/forgejo-ops templates/). If a publish job is ever added, add the
# gate with it, on both sides.

# FOR NOW THE FORGEJO SIDE RUNS ONLY ON DEMAND (workflow_dispatch), so CI
# runs here; its `on:` block is the one other temporary difference.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # The nightly set: the full-depth formal runs, too slow for every push
  # (see CI_CHECKS below and ci/run.sh).
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read

jobs:
  checks:
    name: Sims, lint and quick proofs (push); full proofs (nightly)
    # 24.04, not ubuntu-latest: on the Forgejo runner ubuntu-latest is a 22.04
    # image with Python 3.10, which nothing in this stack is tested on. Named
    # the same on both sides so the two runs are the same environment.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The ivpm cache holds the prebuilt tools (Verilator, Yosys, from
      # edapack). Restore and save are separate steps so the save key can name
      # what the cache HOLDS after ci/run.sh, not what ivpm.yaml says -- see
      # ci/ivpm-cache-key.sh. The prefix restores the newest saved cache;
      # ivpm fetches only what it lacks, and ci/run.sh prunes what no run uses.
      - name: Restore the ivpm package cache
        id: ivpm-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ivpm
          key: ivpm-${{ runner.os }}-
          restore-keys: |
            ivpm-${{ runner.os }}-

      - name: Tests
        # ci/run.sh points IVPM_CACHE at ~/.cache/ivpm, the path cached above.
        env:
          # Push: the sims, lint and the per-push proofs (minutes).
          # Nightly: the same plus the full-depth BMC and the covers.
          CI_CHECKS: ${{ github.event_name == 'schedule' && 'tests lint-rtl fv fv-cover' || 'smoke lint-rtl fv-quick' }}
          # Lets ivpm resolve edapack's `latest` releases through the GitHub
          # API when its unauthenticated path cannot: anonymous API calls get
          # 60 an hour, shared by every job on the runner's address.
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/run.sh

      - name: Compute the ivpm cache key
        id: ivpm-key
        if: always()
        run: |
          k=$(ci/ivpm-cache-key.sh)
          echo "key=${k:+ivpm-${{ runner.os }}-$k}" >> "$GITHUB_OUTPUT"

      - name: Save the ivpm package cache
        # Only when the contents changed (and there are some): an unchanged
        # cache is already saved under this key.
        if: >-
          always() && steps.ivpm-key.outputs.key != '' &&
          steps.ivpm-key.outputs.key != steps.ivpm-restore.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ivpm
          key: ${{ steps.ivpm-key.outputs.key }}

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: ci-reports/
          if-no-files-found: warn
